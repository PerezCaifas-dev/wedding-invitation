</head>
<body>

        <section class="hero">

        <div class="hero-content">

            <h1 class="hero-title">
                Diana <span>&</span> Luis
            </h1>

            <p class="hero-subtitle">
                Tenemos una sorpresa para ti
            </p>

        </div>

        <div class="envelope-container">

            <!-- Sobre cerrado -->
            <img
                src="assets/images/envelope.png"
                alt="Sobre"
                class="envelope closed">

            <!-- Carta -->
            <div class="letter">

                <div class="letter-content">
                    <h1>Diana & Luis</h1>
                </div>

                <div class="countdown">
                    <h2 class="countdown-title">Faltan</h2>
                    <div class="countdown-clock">
                        <div class="time-unit">
                            <span id="days">102</span>
                            <small>Días</small>
                        </div>
                        <span class="separator">:</span>
                        <div class="time-unit">
                            <span id="hours">14</span>
                            <small>Horas</small>
                        </div>
                        <span class="separator">:</span>
                        <div class="time-unit">
                            <span id="minutes">35</span>
                            <small>Minutos</small>
                        </div>
                        <span class="separator">:</span>
                        <div class="time-unit">
                            <span id="seconds">08</span>
                            <small>Segundos</small>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Sobre abierto -->
            <img
                src="assets/images/open-envelope-1.png"
                alt="Sobre abierto"
                class="envelope open">

            <!-- Sello -->
            <img
                src="assets/images/wax-seal.png"
                alt="Sello"
                class="seal">

        </div>

        <p class="tap-message">
            Toca el sello para abrir la invitación
        </p>

    </section>

    </main>

    <audio id="backgroundMusic" preload="auto">
        <source src="assets/music/all-of-me.mp3" type="audio/mpeg">
    </audio>

    <script src="js/script.js"></script>
</body>
</html>
