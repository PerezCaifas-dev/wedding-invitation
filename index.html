<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuestra Boda</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="invitation">
        <section class="hero">
        <!-- <div class="hero-header">
            <img src="assets/images/Diana.png" alt="D & L" class="initials">
        </div> -->
        <div class="envelope-container">
            <img src="assets/images/Diana.png" alt="D & L" class="initials">
            <!-- Sobre cerrado -->
            <img
                src="assets/images/envelope.png"
                alt="Sobre"
                class="envelope closed">

            <!-- Carta -->
            <div class="letter">

                <div class="letter-content">
                    <img
                        src="assets/images/photo-2.jpeg"
                        alt="Sobre"
                        class="photo-2">

                    <img
                        src="assets/images/text-1.png"
                        alt="texto-1"
                        class="text-1">
                    
                    <img
                        src="assets/images/text-2.png"
                        alt="texto-2"
                        class="text-2">

                    <img
                        src="assets/images/text-3.png"
                        alt="texto-3"
                        class="text-3">
                    
                    <div class="countdown">
                        <h2 class="countdown-title">Faltan</h2>
                        <div class="countdown-clock">
                            <div class="time-unit">
                                <span id="days">102</span>
                                <small>Días</small>
                            </div>
                            <span class="separator">:</span>
                            <div class="time-unit">
                                <span id="hours">14</span>
                                <small>Horas</small>
                            </div>
                            <span class="separator">:</span>
                            <div class="time-unit">
                                <span id="minutes">35</span>
                                <small>Minutos</small>
                            </div>
                            <span class="separator">:</span>
                            <div class="time-unit">
                                <span id="seconds">08</span>
                                <small>Segundos</small>
                            </div>
                        </div>
                    </div>
                    <img
                        src="assets/images/photo-3.jpeg"
                        alt="photo-3"
                        class="photo-3">

                    <img
                        src="assets/images/text-4.png"
                        alt="texto-4"
                        class="text-4">

                    <img
                        src="assets/images/text-5.png"
                        alt="texto-5"
                        class="text-5">

                    <img
                        src="assets/images/text-6.png"
                        alt="texto-5"
                        class="text-6">

                    <img
                        src="assets/images/photo-4.jpeg"
                        alt="photo-4"
                        class="photo-4">

                    <p class="church">⛪</p>

                    <img
                        src="assets/images/text-7.png"
                        alt="texto-7"
                        class="text-7">

                    <img
                        src="assets/images/text-8.png"
                        alt="texto-8"
                        class="text-8">

                    <img
                        src="assets/images/text-9.png"
                        alt="texto-9"
                        class="text-9">

                    <div class="location">
                        <a
                            href="https://maps.app.goo.gl/y1yqLHcJ1eNLraXaA"
                            target="_blank"
                            rel="noopener"
                            class="location-button">
                            <span class="icon">📍</span>
                            Ver ubicación
                        </a>
                    </div>
                    <img
                        src="assets/images/photo-5.jpeg"
                        alt="photo-5"
                        class="photo-5">
                    <div class="confirmation">
                        <h2>
                            Confirmación de asistencia
                        </h2>
                        <p>
                            ¿Nos acompañas?
                        </p>
                        <button class="confirm-button">
                            💌 Confirmar asistencia
                        </button>
                    </div>
                </div>
            </div>
            <!-- Sobre abierto -->
            <img
                src="assets/images/open-envelope-1.png"
                alt="Sobre abierto"
                class="envelope open">
            <!-- Sello -->
            <img
                src="assets/images/wax-seal.png"
                alt="Sello"
                class="seal">

            <p class="tap-message">
                Toca el sello para abrir la invitación
            </p>

        </div>
    </section>
    </main>
    <audio id="backgroundMusic" preload="auto">
        <source src="assets/music/all-of-me.mp3" type="audio/mpeg">
    </audio>

    <script src="js/script.js"></script>
</body>
</html>
